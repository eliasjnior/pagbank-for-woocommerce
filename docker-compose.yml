# Host ports default to the main checkout's; `pnpm worktree:env` writes a .env with free ones so
# several worktrees can run their stacks side by side.
x-wordpress-db: &wordpress-db
  WORDPRESS_DB_HOST: database:3306
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: wordpress
  WORDPRESS_DB_NAME: wordpress

services:
  wordpress:
    build: docker/wordpress
    # Rebuilding on every `up` is a cache hit unless docker/wordpress changed.
    pull_policy: build
    depends_on:
      database:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      - ./wp:/var/www/html
      - ./:/var/www/html/wp-content/plugins/pagbank-for-woocommerce
      - ./docker/wordpress/php.ini:/usr/local/etc/php/conf.d/zz-pagbank.ini:ro
      - ./docker/wordpress/apache.conf:/etc/apache2/sites-enabled/pagbank.conf:ro
      - ./docker/wordpress/apache-ports.conf:/etc/apache2/ports.conf:ro
      - ./logs:/var/log
      - ./certs:/etc/ssl/custom-certs:ro
      # Shared by every worktree, so WordPress, WooCommerce and themes download once.
      - ${HOME}/.wp-cli/cache:/var/www/.wp-cli/cache
    # Resolves the site host to this container, so loopback requests from WordPress and WP-CLI
    # reach Apache instead of the host's loopback.
    networks:
      default:
        aliases:
          - ${WP_HOST:-wordpress.localhost}
    ports:
      - ${WP_HTTP_PORT:-80}:${WP_HTTP_PORT:-80}
      - ${WP_HTTPS_PORT:-443}:${WP_HTTPS_PORT:-443}
    environment:
      <<: *wordpress-db
      WP_HTTP_PORT: ${WP_HTTP_PORT:-80}
      WP_HTTPS_PORT: ${WP_HTTPS_PORT:-443}
    healthcheck:
      test: curl -fso /dev/null "http://127.0.0.1:$${WP_HTTP_PORT}/wp-includes/images/blank.gif"
      interval: 2s
      start_period: 60s

  database:
    image: mariadb
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: wordpress
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    healthcheck:
      test: mariadb-admin ping -h 127.0.0.1 --silent
      interval: 2s
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin
    depends_on:
      - database
    ports:
      - ${PHPMYADMIN_PORT:-8080}:80
    environment:
      PMA_ARBITRARY: 0
      PMA_HOST: database
      PMA_VERBOSE: wordpress
      PMA_USER: wordpress
      PMA_PASSWORD: wordpress
      PHP_UPLOAD_MAX_FILESIZE: 1G
      PHP_MAX_INPUT_VARS: 1G

  mailpit:
    image: axllent/mailpit
    ports:
      - ${MAILPIT_PORT:-8025}:8025
      - ${MAILPIT_SMTP_PORT:-1025}:1025
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  composer:
    image: composer:latest
    user: '${UID:-1000}:${GID:-1000}'
    volumes:
      - ./composer.json:/app/composer.json
      - ./composer.lock:/app/composer.lock
      - ./vendor:/app/vendor
    working_dir: /app
    profiles:
      - tools

  php-tools:
    image: wordpress:php8.3
    user: '${UID:-1000}:${GID:-1000}'
    volumes:
      - ./:/var/www/html/wp-content/plugins/pagbank-for-woocommerce
    working_dir: /var/www/html/wp-content/plugins/pagbank-for-woocommerce
    profiles:
      - tools

volumes:
  db_data: {}
