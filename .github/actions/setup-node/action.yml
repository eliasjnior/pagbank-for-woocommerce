name: Set up Node
description: Install Node, pnpm (version from package.json) and the dependencies from pnpm-lock.yaml.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash
