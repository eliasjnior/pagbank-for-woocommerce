name: Set up PHP
description: Install PHP and the Composer dependencies from composer.lock.

inputs:
  php-version:
    description: PHP version to install.
    default: "8.3"
  composer-options:
    description: Extra options for composer install.
    default: ""
  tools:
    description: Extra tools for shivammathur/setup-php.
    default: ""

runs:
  using: composite
  steps:
    - uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php-version }}
        coverage: none
        tools: ${{ inputs.tools }}

    - uses: ramsey/composer-install@v4
      with:
        composer-options: ${{ inputs.composer-options }}
