upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 512M
max_execution_time = 300
max_input_time = 1000

; PHP Error Display Configuration
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /var/log/php_errors.log
html_errors = On

; WordPress and WooCommerce load more files than the image's opcache defaults hold
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000

; Mail goes to Mailpit, which accepts anything on its SMTP port
sendmail_path = "/usr/bin/msmtp --host=mailpit --port=1025 --read-envelope-from -t"
